<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="JP">
  <style>
    .icon-bg {
      fill: #ffffff;
      stroke: #ebebeb;
    }
    .icon-text {
      fill: #252525;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .icon-bg {
        fill: #2e2e2e;
        stroke: rgba(255, 255, 255, 0.1);
      }
      .icon-text {
        fill: #fafafa;
      }
    }
  </style>
  <rect class="icon-bg" width="32" height="32" rx="8" stroke-width="1" />
  <text
    class="icon-text"
    x="16"
    y="21"
    text-anchor="middle"
    font-size="13"
    font-weight="600"
    letter-spacing="-0.06em"
  >
    JP
  </text>
</svg>
